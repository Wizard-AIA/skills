name: Validate Skills and Registry

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate skill format and executable-file rule
        run: python3 .github/scripts/validate_skills.py

      - name: Verify registry.json is up-to-date
        run: |
          python3 .github/scripts/build_registry.py
          git diff --exit-code registry.json || (echo "error: registry.json is out of date. Run python3 .github/scripts/build_registry.py and commit." && exit 1)
